name: ApplyFlow CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Test Backend & Build Frontend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      # Step 1: Backend checks
      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Check Backend Syntax & Integrity
        working-directory: server
        run: npm test

      # Step 2: Frontend checks & build
      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend Application (Vite)
        working-directory: client
        run: npm run build

      - name: Verify Distribution Assets Exist
        run: test -d client/dist && test -f client/dist/index.html
